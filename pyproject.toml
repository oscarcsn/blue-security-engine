[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-security-engine"
version = "0.1.0"
description = "Graph validation, composite-key encoding, authenticated manifests, and Linux isolation configuration."
readme = "README.md"
authors = [
    { name = "Oscar Cisneros", email = "ocisnerus@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "cybersecurity",
    "blue-team",
    "agentic-ai",
    "bubblewrap",
    "sandboxing",
    "graph-validation",
    "integrity-manifests",
    "cgroups",
    "hardening"
]

[project.urls]
Homepage = "https://github.com/oscarcsn"

[project.scripts]
bse-demo = "bse.demo:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
bse = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
